<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求确认单</title>
<style>
:root{
  /* 白纸蓝墨（redesign）：灰底白卡、圆角浅影、蓝为主动作色、红只留给警示 */
  --paper:#f9fafb;
  --card:#fff;
  --card-2:#f9fafb;
  --ink:#111827;
  --ink-70:#6b7280;
  --ink-45:#9ca3af;
  --rule:#e5e7eb;
  --rule-2:#f3f4f6;
  --rule-in:#d1d5db;
  --blue:#1d4ed8;
  --blue-deep:#1e40af;
  --blue-soft:#eff6ff;
  --blue-line:oklch(0.86 0.06 262);
  --blue-ring:oklch(0.93 0.04 262);
  --red:#b91c1c;
  --red-soft:#fef2f2;
  --red-line:oklch(0.86 0.08 25);
  --green:#166534;
  --green-soft:#f0fdf4;
  --green-line:oklch(0.87 0.07 152);
  --amber:oklch(0.52 0.11 75);
  --amber-soft:oklch(0.975 0.03 92);
  --amber-line:oklch(0.85 0.09 85);
  /* 代码坐标专用：靛蓝底，与选项的蓝区分开 */
  --code-ink:#3730a3;
  --code-bg:#eef2ff;

  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* 字阶：7 级 */
  --t-title:26px; --t-h2:18px; --t-q:16px; --t-body:15px;
  --t-sub:13.5px; --t-cap:12.5px; --t-label:11px;
  /* 间距：6 级 */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-6:24px; --s-8:32px;

  --r-card:8px; --r-ctl:6px;
  --shadow:0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:var(--t-body);line-height:1.75;
}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue-deep)}
button,input,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--ink-45)}
.wrap{max-width:820px;margin:0 auto;padding:36px 36px 100px}

@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* ── 单据抬头 ───────────────────────────────── */
.masthead{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:26px 30px;
  display:flex;gap:26px;align-items:flex-start;
}
.masthead-main{flex:1;min-width:0}
.doc-kicker{
  font-family:var(--mono);font-size:var(--t-label);letter-spacing:.18em;
  color:var(--ink-45);margin-bottom:var(--s-2);
}
h1{
  font-size:var(--t-title);font-weight:700;line-height:1.3;margin:0 0 var(--s-3);
  letter-spacing:.01em;
}
.doc-meta{font-size:var(--t-sub);color:var(--ink-70);line-height:1.9}
.doc-meta b{color:var(--ink);font-weight:600}
.usage{
  margin-top:14px;padding:10px 14px;background:var(--amber-soft);
  border:1px solid var(--amber-line);border-radius:var(--r-ctl);
  font-size:13px;line-height:1.8;color:var(--ink);text-wrap:pretty;
}
.rev{display:block;margin-top:var(--s-3);font-family:var(--mono);font-size:11.5px;color:var(--ink-45)}
.seal{
  flex:0 0 auto;border:1.5px solid var(--red);color:var(--red);border-radius:var(--r-card);
  padding:12px var(--s-4);text-align:center;font-family:var(--mono);
  line-height:1.6;letter-spacing:.05em;transform:rotate(1.5deg);opacity:.92;
}
.seal .no{display:block;font-size:13px;font-weight:700}
.seal .v{display:block;font-size:10px;opacity:.85}
.seal .due{display:block;font-size:10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--red-line)}

/* ── 怎么填 ─────────────────────────────────── */
.howto{
  margin-top:14px;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r-card);padding:var(--s-4) 30px 18px;
}
.howto-lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-45);margin-bottom:10px}
.howto-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
.howto-it{display:flex;gap:10px;font-size:13px;line-height:1.75;color:var(--ink-70)}
.howto-it .n{font-family:var(--mono);font-weight:700;color:var(--blue)}
.howto-it b{color:var(--ink)}

/* ── 进度条（吸顶浮卡） ─────────────────────── */
.statusbar{
  position:sticky;top:12px;z-index:30;margin:var(--s-4) 0 0;
  display:flex;align-items:center;flex-wrap:wrap;gap:9px 14px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--rule);border-radius:var(--r-card);
  box-shadow:0 2px 10px rgba(16,24,40,.07);padding:10px var(--s-4);
}
.meter{flex:0 0 110px;height:6px;background:var(--rule);border-radius:999px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);border-radius:999px;transition:width .35s ease}
.status-text{font-size:var(--t-cap);color:var(--ink-70);flex:1;min-width:0}
.status-text .num{font-family:var(--mono);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.status-text .warn{color:var(--red);font-weight:600}
.status-text .amb{color:var(--amber);font-weight:600}
.btn{
  font:inherit;font-size:var(--t-cap);font-weight:600;
  background:var(--blue);color:#fff;border:1px solid var(--blue);
  border-radius:var(--r-ctl);padding:8px var(--s-4);cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--rule-in)}
.btn.ghost:hover{background:var(--card);border-color:var(--blue);color:var(--blue)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,summary:focus-visible,.opt:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px
}

/* 硬活筛选（进度条里的「先看」行） */
.whorow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:0 1 100%;
  padding-top:9px;margin-top:2px;border-top:1px dashed var(--rule)}
.whorow .lb{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-45);margin-right:2px}
.whochip{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--rule-in);background:var(--card);color:var(--ink-70);cursor:pointer}
.whochip:hover{border-color:var(--blue);color:var(--blue)}
.whochip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.whochip .c{font-family:var(--mono);font-size:var(--t-label);opacity:.75;margin-left:var(--s-1)}

/* ── 题号索引：左侧悬浮窄条，悬停展开 ───────── */
main{display:block}
.rail{
  position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;gap:2px;
  width:58px;max-height:78vh;overflow-y:auto;overflow-x:hidden;
  padding:10px 8px;border-radius:12px;
  border:1px solid rgba(229,231,235,.9);background:rgba(255,255,255,.72);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(16,24,40,.12);
  transition:width .18s ease;
}
.rail:hover,.rail:focus-within{width:272px}
.rail-hd{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-45);
  padding:2px var(--s-2) var(--s-2);white-space:nowrap;display:none;
}
.rail:hover .rail-hd,.rail:focus-within .rail-hd{display:block}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail li{margin:0}
.rail li.rail-sep{height:1px;background:var(--rule);margin:var(--s-1) 6px}
.rail a{
  display:flex;gap:9px;align-items:center;text-decoration:none;color:#4b5563;
  padding:6px var(--s-2);border-radius:var(--r-ctl);font-size:var(--t-cap);white-space:nowrap;
}
.rail a.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.rail a.dim{opacity:.35}
.rail .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--card);border:1.5px solid var(--ink-45)}
.rail a[data-st="done"] .dot{background:var(--blue);border-color:var(--blue)}
.rail a[data-st="skip"] .dot{background:var(--red);border-color:var(--red)}
.rail a[data-st="must"] .dot{border:2px solid var(--red)}
.rail a[data-st="p1"] .dot{border-color:var(--amber)}
.rail .k{font-family:var(--mono);font-size:var(--t-label);font-weight:700;min-width:16px;text-align:center}
.rail .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s ease}
.rail:hover .t,.rail:focus-within .t{opacity:1}
.rail .frac{font-family:var(--mono);font-size:var(--t-label)}
.rail-toggle{display:none}
@media (max-width:999px){
  /* 窄屏没有悬停：索引改为把手呼出的浮层，展开时盖住正文是可接受的 */
  .rail{left:0;top:96px;transform:none;width:272px;border-radius:0 12px 12px 0;
    transition:transform .18s ease}
  .rail .t{opacity:1}
  .rail .rail-hd{display:block}
  .rail.collapsed{transform:translateX(calc(-100% - 14px))}
  .rail:not(.collapsed)~.rail-toggle{left:272px}
  .rail-toggle{
    display:block;position:fixed;left:0;top:96px;z-index:41;
    width:28px;padding:10px 0;cursor:pointer;
    background:var(--ink);color:#fff;border:none;font:inherit;
    font-size:12px;line-height:1.4;border-radius:0 var(--r-ctl) var(--r-ctl) 0;
    writing-mode:vertical-rl;letter-spacing:.14em;
  }
}

/* ── 区块 ───────────────────────────────────── */
.part{margin-top:var(--s-8);margin-bottom:44px;scroll-margin-top:130px}
.part-hd{display:flex;align-items:baseline;gap:var(--s-3);border-bottom:2px solid var(--ink);padding-bottom:10px}
.part-hd h2{font-size:var(--t-h2);font-weight:700;margin:0}
.part-hd .hint{font-size:var(--t-cap);color:var(--ink-45)}

/* 第一部分 · 逐条核对 */
.p1-card{
  margin-top:var(--s-4);background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;
}
.p1-row{display:grid;grid-template-columns:36px 1fr 136px;gap:2px var(--s-4);padding:var(--s-4) 20px}
.p1-row+.p1-row{border-top:1px solid var(--rule-2)}
.p1-n{
  font-family:var(--mono);font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;padding-top:var(--s-1);color:var(--amber);
}
.p1-row:has(input:checked) .p1-n{color:var(--ink-45)}
.p1-m{min-width:0}
.p1-t{font-size:14.5px;line-height:1.8;text-wrap:pretty}
.p1-note{margin-top:6px;font-size:var(--t-cap);line-height:1.7;color:var(--ink-70);text-wrap:pretty}
.p1-c{display:flex;align-items:flex-start;justify-content:flex-end}
.seg{display:flex}
.seg-b{
  font-size:13px;padding:5px 0;width:60px;cursor:pointer;text-align:center;
  background:var(--card);border:1px solid var(--rule-in);color:var(--ink-70);
}
.seg-b input{position:absolute;opacity:0;width:0;height:0}
.seg-b.ok{border-radius:var(--r-ctl) 0 0 var(--r-ctl)}
.seg-b.no{border-radius:0 var(--r-ctl) var(--r-ctl) 0;margin-left:-1px}
.seg-b:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.seg-b.ok:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.seg-b.no:has(input:checked){background:var(--red);border-color:var(--red);color:#fff;font-weight:600;position:relative;z-index:1}
.p1why{display:none;margin-top:10px}
.p1-row.open .p1why{display:block;border-color:var(--red-line);animation:drop .2s ease}
.p1-extra{padding:var(--s-4) 20px 20px;border-top:1px solid var(--rule-2)}
.p1-extra label{display:block;font-family:var(--mono);font-size:var(--t-label);letter-spacing:.1em;color:var(--ink-45);margin-bottom:6px}

/* ── 题目 ───────────────────────────────────── */
.q{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);
  margin-top:var(--s-4);box-shadow:var(--shadow);scroll-margin-top:130px;
}
.q.answered{box-shadow:var(--shadow),inset 3px 0 0 var(--blue)}
.q.denied{box-shadow:var(--shadow),inset 3px 0 0 var(--red)}
.q-hd{display:flex;gap:14px;padding:18px var(--s-6) var(--s-3);border-bottom:1px dashed var(--rule)}
.q-no{
  font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.2;color:var(--ink-45);
  flex:0 0 auto;min-width:26px;font-variant-numeric:tabular-nums;
}
.q.answered .q-no{color:var(--blue)}
.q.denied .q-no{color:var(--red)}
.q-hd .h{flex:1;min-width:0}
.q-t{font-size:var(--t-q);font-weight:600;line-height:1.55;margin:0 0 var(--s-2);text-wrap:pretty}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{
  font-size:var(--t-label);font-family:var(--mono);letter-spacing:.04em;padding:2px var(--s-2);
  border-radius:999px;border:1px solid var(--rule);color:var(--ink-70);background:var(--card-2);
}
.tag.d-biz{border-color:var(--blue-line);color:var(--blue);background:var(--blue-soft)}
.tag.d-dev{border-color:var(--rule);color:var(--ink-70);background:var(--card-2)}
.tag.first{border-color:var(--red-line);color:var(--red);background:var(--red-soft);font-weight:700}
.tag.done{margin-left:auto;border-color:var(--green-line);color:var(--green);background:var(--green-soft)}
.q.denied .tag.done{border-color:var(--red);color:#fff;background:var(--red)}

.q-bd{padding:var(--s-4) var(--s-6) 20px}
.bg{
  font-size:var(--t-sub);color:var(--ink-70);line-height:1.85;
  margin:0 0 var(--s-4);max-width:62ch;text-wrap:pretty;
}
.bg b{color:var(--ink)}

.grp{margin-bottom:14px}
.grp-q{font-size:var(--t-sub);font-weight:600;margin-bottom:var(--s-2);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.inline{flex-direction:row;flex-wrap:wrap;gap:var(--s-2)}
.opt{
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;position:relative;
  border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--card);
  padding:10px 14px;font-size:14.5px;line-height:1.65;
  transition:border-color .15s,background .15s;
}
.opts.inline .opt{padding:7px 12px;font-size:var(--t-sub)}
.opt:hover{border-color:var(--ink-45)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .mk{
  flex:0 0 auto;width:15px;height:15px;margin-top:5px;border:1.5px solid var(--ink-45);
  border-radius:50%;background:var(--card);
}
.opt input[type=checkbox]+.mk{border-radius:3px}
.opt .k{font-family:var(--mono);font-weight:700;margin-right:var(--s-1)}
.opt:has(input:checked){border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue);color:var(--ink)}
.opt:has(input:checked) .mk{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff}
.opt input[type=checkbox]:checked+.mk{box-shadow:none}
.opt .cost{display:block;margin-top:3px;color:var(--ink-45);font-size:var(--t-cap);font-weight:400}
.opt.none,.opt.other{border-style:dashed;color:var(--ink-70)}
.opt.none:has(input:checked),.opt.other:has(input:checked){color:var(--ink);border-style:solid}

/* 条件块 */
.cond{
  display:none;margin-top:10px;padding:var(--s-3) 14px;background:var(--blue-soft);
  border:1px dashed var(--blue-line);border-radius:var(--r-ctl);
}
.cond.show{display:block;animation:drop .2s ease}
.cond-hd{font-size:var(--t-label);font-family:var(--mono);color:var(--blue);letter-spacing:.05em;margin-bottom:var(--s-2)}
.skipped{
  display:none;margin-top:10px;padding:10px 14px;background:var(--card-2);
  border:1px dashed var(--rule);border-radius:var(--r-ctl);color:var(--ink-45);font-size:var(--t-sub);
}
.skipped.show{display:block}

/* 签名元素：演示数字结算条 */
.demo{margin:0 0 14px;border:1px solid var(--rule);border-radius:var(--r-ctl);overflow:hidden;background:var(--card)}
.demo-hd{
  display:flex;justify-content:space-between;gap:var(--s-3);align-items:baseline;
  padding:var(--s-2) var(--s-3);background:var(--card-2);border-bottom:1px solid var(--rule);
}
.demo-hd .lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--red);white-space:nowrap}
.demo-hd .given{font-size:var(--t-cap);color:var(--ink-70);text-align:right;line-height:1.7}
.demo-hd .given span{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.demo table{width:100%;border-collapse:collapse}
.demo td{padding:7px var(--s-3);font-size:13px;border-top:1px solid var(--rule-2)}
.demo tr:first-child td{border-top:none}
.demo td.k{color:var(--ink-70)}
.demo td.v{
  width:34%;text-align:right;font-family:var(--mono);font-weight:700;
  font-variant-numeric:tabular-nums;border-left:1px solid var(--rule);
}
.demo tr.hit td{background:var(--blue-soft);color:var(--ink)}
.demo tr.hit td.v{color:var(--blue)}
.demo tr.hit td.k::before{content:"▸ ";color:var(--blue);font-weight:700}
.demo-assumed{padding:7px var(--s-3);border-top:1px dashed var(--amber-line);
  background:var(--amber-soft);font-size:var(--t-cap);color:var(--ink)}

/* 作答区 */
.ans{margin-top:var(--s-1)}
.ans label{display:block;font-size:var(--t-label);font-family:var(--mono);letter-spacing:.1em;color:var(--ink-45);margin-bottom:6px}
textarea,input[type=text]{
  width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule-in);border-radius:var(--r-ctl);padding:var(--s-2) 11px;
  resize:vertical;outline:none;
}
textarea:focus,input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ring)}
.p1why:focus,.deny-w:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
textarea::placeholder,input::placeholder{color:var(--ink-45)}

/* 填写信息 */
.signoff{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:var(--s-6) 30px;margin-top:44px;scroll-margin-top:130px;
}
.signoff h2{font-size:var(--t-q);font-weight:700;margin:0 0 var(--s-4)}
.sign-grid{display:grid;grid-template-columns:minmax(0,260px);gap:var(--s-4);align-items:end}
.fld label{display:block;font-size:var(--t-label);font-family:var(--mono);letter-spacing:.08em;color:var(--ink-45);margin-bottom:6px}
.fld label .req{color:var(--red)}
#s-date{background:var(--card-2);color:var(--ink-70)}

/* 导出条（随文卡片，不再吸底） */
.dock{
  margin-top:var(--s-6);display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:var(--s-4) var(--s-6);
}
.dock .why{font-size:var(--t-cap);color:var(--red)}

dialog{
  border:none;border-radius:10px;background:var(--card);padding:0;
  max-width:94vw;width:760px;box-shadow:0 24px 64px rgba(16,24,40,.28);
}
dialog[open]{animation:pop .22s ease}
dialog::backdrop{background:rgba(17,24,39,.5);animation:fade .15s ease}
.dlg-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--rule)}
.dlg-hd h3{margin:0;font-size:var(--t-q);font-weight:700}
.dlg-bd{padding:0;max-height:64vh;overflow-y:auto}
/* 窄屏下说明文案会把两个按钮挤成一字一行 —— 底栏必须允许换行,按钮不许被压。 */
.dlg-ft{padding:var(--s-3) 22px;border-top:1px solid var(--rule);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.dlg-ft .note{margin-right:auto;flex:1 1 18rem;font-size:11.5px;color:var(--ink-70);line-height:1.6}
.dlg-ft .btn{flex:0 0 auto;white-space:nowrap}

/* 依据：外层给业务看白话，坐标折叠在内层 */
.ev{margin:0 0 10px;border:1px solid var(--rule);background:var(--card-2);border-radius:var(--r-ctl)}
.ev.tier-guess{border-color:var(--red);background:var(--red-soft)}
.ev summary{list-style:none;cursor:pointer;display:flex;gap:9px;align-items:center;padding:var(--s-2) var(--s-3);font-size:var(--t-cap);color:var(--ink-70)}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:"▾";margin-left:auto;color:var(--ink-45);font-size:var(--t-label)}
.ev[open] summary::after{content:"▴"}
.ev-badge{font-family:var(--mono);font-size:var(--t-label);letter-spacing:.04em;padding:2px var(--s-2);border-radius:999px;border:1px solid;white-space:nowrap}
.ev-badge.src{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.ev-badge.code{color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
.ev-badge.guess{color:#fff;border-color:var(--red);background:var(--red);font-weight:700}
.ev-more{color:var(--ink-70)}
.ev-b{padding:2px var(--s-3) var(--s-3)}
.ev-b code{
  display:block;font-family:var(--mono);font-size:11.5px;line-height:1.6;
  color:var(--code-ink);background:var(--code-bg);border-radius:4px;
  padding:6px 9px;word-break:break-all;
}
.cite{padding:6px 0;font-size:var(--t-cap)}
.cite-k{font-family:var(--mono);font-size:10.5px;color:var(--ink-45);display:block;margin-bottom:2px}
.cite.none{color:var(--red);font-size:var(--t-sub)}
.ev-weak{margin-top:7px;padding:var(--s-2) 10px;background:var(--card);border-left:2px solid var(--red);font-size:var(--t-sub);color:var(--ink);max-width:62ch}

/* 依据两层：白话在外，坐标折叠在内 */
.code-cite{display:block;padding:var(--s-2) 0}
.logic{max-width:62ch}
.code-cite .logic{font-size:13px;line-height:1.75;color:var(--ink)}
.code-cite .logic b{color:var(--blue)}
.logic-note{color:var(--ink-45);font-size:12px}
.coords{margin-top:7px}
.coords summary{cursor:pointer;font-size:var(--t-label);color:var(--ink-45);font-family:var(--mono)}
.coords summary:hover{color:var(--ink)}
.coords>div,.coords .brs{margin-top:6px}
.coords .entry{font-size:var(--t-label);color:var(--ink-70)}
.coords .entry code{display:inline;padding:1px 5px}
.coords .brs{margin:6px 0 0;padding-left:18px;font-size:var(--t-cap);color:var(--ink-70)}
.rule-cite .logic b{color:var(--green)}
.unreviewed{margin-top:var(--s-2);padding:6px 10px;background:var(--amber-soft);
  border-left:2px solid var(--amber-line);border-radius:0 4px 4px 0;font-size:var(--t-cap);color:var(--ink)}
.reviewed{margin-top:var(--s-2);padding:6px 10px;background:var(--green-soft);
  border-left:2px solid var(--green);border-radius:0 4px 4px 0;font-size:var(--t-cap);color:var(--ink-70)}

/* 证伪出口 */
.deny{margin:0 0 var(--s-4)}
.deny-t{display:inline-flex;gap:var(--s-2);align-items:center;font-size:var(--t-cap);color:var(--ink-45);cursor:pointer}
.deny-t input{position:absolute;opacity:0;width:0;height:0}
.deny-t .mk{width:13px;height:13px;border:1.5px solid var(--ink-45);border-radius:3px;background:var(--card);position:relative;flex:0 0 auto}
.deny-t:hover{color:var(--red)}
.deny-t:has(input:checked){color:var(--red);font-weight:600}
.deny-t:has(input:checked) .mk{background:var(--red);border-color:var(--red)}
.deny-w{display:none;margin-top:var(--s-2)}
.deny.on .deny-w{display:block;border-color:var(--red-line);animation:drop .2s ease}
.q.denied .q-bd .grp,.q.denied .demo{opacity:.45}

/* 人读回执 */
.rc{padding:18px 22px 8px}
.rc-cards{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:14px}
.rc-card{flex:1 1 96px;border:1px solid var(--rule);background:var(--card);border-radius:var(--r-ctl);padding:10px var(--s-3);text-align:center}
.rc-card b{display:block;font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.rc-card span{font-size:var(--t-label);color:var(--ink-70)}
.rc-card.bad{border-color:var(--red);background:var(--red-soft)}
.rc-card.bad b{color:var(--red)}
.rc-card.warn{border-color:var(--amber-line);background:var(--amber-soft)}
.rc-card.warn b{color:var(--amber)}
.rc-sign{font-size:13px;padding:9px var(--s-3);background:var(--green-soft);border-left:3px solid var(--green);border-radius:0 var(--r-ctl) var(--r-ctl) 0;color:var(--ink);margin-bottom:14px}
.rc-clash{font-size:var(--t-sub);padding:9px var(--s-3);background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 var(--r-ctl) var(--r-ctl) 0;margin-bottom:14px;line-height:1.7}
.rc-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.rc-list li{display:grid;grid-template-columns:30px 1fr;gap:var(--s-3);padding:11px 2px;border-bottom:1px solid var(--rule-2)}
.rc-list .n{font-family:var(--mono);font-size:15px;color:var(--ink-45);text-align:right;font-variant-numeric:tabular-nums}
.rc-list .qt{display:block;font-size:var(--t-cap);color:var(--ink-70);margin-bottom:2px}
.rc-list .a{display:block;font-size:14px;font-weight:600;line-height:1.65}
.rc-list .sub{display:block;font-size:var(--t-cap);color:var(--ink-70);font-weight:400;margin-top:3px}
.rc-list li.no .a{color:var(--red)}
.rc-list li.gap .a{color:var(--amber)}
.rc-raw{border-top:1px solid var(--rule);padding:0 22px var(--s-3)}
.rc-raw summary{cursor:pointer;padding:10px 0;font-size:var(--t-cap);color:var(--ink-45)}
.rc-raw summary:hover{color:var(--ink)}
.rc-raw pre{
  margin:0 0 6px;max-height:300px;overflow:auto;padding:14px var(--s-4);font-family:var(--mono);
  font-size:11.5px;line-height:1.7;white-space:pre-wrap;
  background:var(--card-2);border:1px solid var(--rule);border-radius:var(--r-ctl);color:var(--ink);
}

/* 跨题联动 */
.grp.na>.grp-q{color:var(--ink-45);text-decoration:line-through}
.grp.na>.opts{display:none}
.grp.na .na-note{padding:var(--s-2) var(--s-3);background:var(--card-2);
  border:1px dashed var(--rule-in);border-radius:var(--r-ctl);font-size:var(--t-cap);color:var(--ink-70);line-height:1.7}
.carry-hint{display:none;margin-top:5px;font-size:var(--t-label);color:var(--blue)}
.carry-hint.on{display:block}
input.carried{border-color:var(--blue-line);background:var(--blue-soft)}
.clash{display:none;margin:0 0 14px;padding:11px 14px;background:var(--red-soft);
  border:1px solid var(--red-line);border-left:3px solid var(--red);border-radius:var(--r-ctl);
  font-size:var(--t-sub);line-height:1.7;max-width:62ch}
.clash.show{display:block;animation:drop .2s ease}
.clash b{color:var(--red)}
.clash textarea{margin-top:var(--s-2)}

/* 层级闸门：居中分隔线 */
.layer-hd{display:flex;align-items:center;gap:var(--s-3);margin:30px 0 0;
  font-size:var(--t-cap);color:var(--ink-45);text-align:center}
.layer-hd::before,.layer-hd::after{content:"";flex:1;height:1px;background:var(--rule)}

/* 题目全部由 JS 渲染 —— 脚本没跑起来时页面上只剩 124 字的外壳(标题、题目、
   任何错误提示都没有)。受众是财务／运营,且微信内置浏览器是已知风险,
   必须给一句业务看得懂、能自己往下走的话。 */
.bootfail{margin:var(--s-4) 0;padding:14px var(--s-4);border:2px solid var(--red);
  border-radius:var(--r-card);background:var(--red-soft);font-size:var(--t-body);line-height:1.7;color:var(--ink)}
.bootfail .why{margin-top:var(--s-2);font-family:var(--mono);font-size:var(--t-label);
  color:var(--ink-45);word-break:break-all}

@media (max-width:860px){
  .wrap{padding:20px 16px 80px}
  .masthead{flex-direction:column-reverse;gap:14px;padding:20px}
  .seal{align-self:flex-start;transform:none}
  .howto{padding:14px 20px 16px}
  .howto-grid{grid-template-columns:1fr}
  .status-text{order:3;flex-basis:100%}
  .q-hd{padding:14px var(--s-4) 10px}
  .q-bd{padding:14px var(--s-4) var(--s-4)}
  .p1-row{grid-template-columns:28px 1fr;padding:14px var(--s-4)}
  .p1-c{grid-column:2;justify-content:flex-start;margin-top:var(--s-2)}
  .p1-extra{padding:14px var(--s-4) var(--s-4)}
  .signoff{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  @page{margin:15mm}
  body{background:#fff;font-size:16px;color:#000}
  /* @page 已经给了纸张边距;.wrap 屏幕上留的 padding 叠加上去会在末页留出大段纯空白 */
  .wrap{padding:0;max-width:none}
  .statusbar,.dock,.rail,.rail-toggle,.howto,.deny{display:none!important}
  .ev summary::after{display:none!important}
  .q,.masthead,.signoff,.p1-row,.demo{break-inside:avoid;box-shadow:none!important}
  .cond,.ev,.ev-b,.coords{display:block!important}
  .seal{border-color:#000;color:#000;transform:none}
  .tag.first{border:1.5px solid #000;color:#000;background:#fff;font-weight:700}
  .ev-badge.guess{border:1.5px solid #000;background:#000;color:#fff;font-weight:700}
  .ev-b code{color:#000;background:#fff;border:1px solid #ccc}
  .clash,.ev-weak{border-color:#000;background:#fff}
  textarea,input[type=text]{border-color:#000;background:repeating-linear-gradient(#fff 0 27px,#ccc 27px 28px)}
}
</style>
</head>
<body>
<div class="wrap">


<script id="qdata" type="application/json">__QUESTIONNAIRE_DATA__</script>

<!-- 同一句话写两遍是刻意的:noscript 只在完全没有 JS 时显示,下面那个 div 是
     JS 跑起来了但 boot 抛异常时用的(数据块被邮件网关/复制粘贴弄坏最常见)。
     两种失败对业务是同一件事,所以给同一句话;措辞用后果说话,并给出下一步。 -->
<noscript>
  <div class="bootfail" role="alert">
    这份单子需要浏览器的脚本功能才能显示题目。请换用系统浏览器打开，或找发出人要一份 Markdown 版本填写。
  </div>
</noscript>
<div class="bootfail" id="bootfail" role="alert" hidden>
  这份单子需要浏览器的脚本功能才能显示题目。请换用系统浏览器打开，或找发出人要一份 Markdown 版本填写。
  <div class="why" id="bootfailWhy"></div>
</div>

<header class="masthead" id="masthead"></header>
<div class="howto" id="howto"></div>
<div class="statusbar">
  <div class="meter"><i id="meter"></i></div>
  <div class="status-text" id="statusText">尚未开始</div>
  <button class="btn ghost" type="button" id="btnJumpNext" onclick="jumpNext()">跳到下一道未答</button>
  <div class="whorow" id="whoRow"></div>
</div>
<nav class="rail" id="railNav" aria-label="题号索引">
  <div class="rail-hd" id="railHd">题号索引</div>
  <ol id="rail"></ol>
</nav>
<button class="rail-toggle" id="railToggle" type="button"
  onclick="toggleRail()" aria-controls="railNav" aria-expanded="true"></button>
<main>
  <section class="part" id="part1"></section>
  <section class="part" id="part2"></section>
  <section class="signoff" id="signoff"></section>
</main>

<div class="dock">
  <span id="dockWhy" class="why"></span>
  <button class="btn" id="btnExport" type="button" onclick="openReceipt()">导出回执</button>
  <button class="btn ghost" id="btnPrint" type="button" onclick="window.print()">打印／存 PDF</button>
</div>
</div>

<dialog id="dlg">
  <div class="dlg-hd"><h3 id="dlgTitle">发回之前，请过一眼</h3>
    <button class="btn ghost" id="btnDlgClose" type="button" onclick="dlg.close()">关闭</button></div>
  <div class="dlg-bd">
    <div class="rc" id="rcBody"></div>
    <details class="rc-raw">
      <summary id="rcRawSummary">查看要发回给开发的原始文本（技术细节，不看也没关系）</summary>
      <pre id="receipt"></pre>
    </details>
  </div>
  <div class="dlg-ft">
    <span class="note" id="dlgNote">「复制回执」复制的是给 AI 的机读回执，粘贴到您和开发的对话里发回即可。</span>
    <button class="btn ghost" id="btnCopy" type="button" onclick="copyReceipt(this)">复制回执</button>
    <button class="btn" id="btnDownload" type="button" onclick="downloadReceipt()">下载 .md 文件</button>
  </div>
</dialog>

<script>
/* ── 渲染器：题目内容全部来自注入的 qdata，模板本身不含任何项目内容 ──────────
   必须先跑完再取 .q 节点：下面的 QS、索引、兜底出口都依赖已渲染好的 DOM。 */
/* boot 失败时把页面上那句提示显示出来 —— 不给提示的话业务看到的是一张
   124 字的空壳:没有标题、没有题目、也没有任何线索说该找谁。
   技术细节另起一行给开发,业务不用理会。 */
function bootFail(e){
  const box = document.getElementById('bootfail'), why = document.getElementById('bootfailWhy');
  if(box) box.hidden = false;
  if(why) why.textContent = '技术细节（给开发看）：' + (e && e.message ? e.message : e);
  ['statusbar','body'].forEach(c => document.querySelectorAll('.' + c)
    .forEach(el => el.style.display = 'none'));
}

let DATA;
try {
  DATA = JSON.parse(document.getElementById('qdata').textContent);
} catch(e) {
  bootFail(e);
  throw e;          /* 后面的渲染依赖 DATA,继续跑只会刷一串二级异常 */
}
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 页面外壳的所有文案来自 build 注入的 doc._i18n（唯一真源 scripts/i18n.py）——
   模板里不再写死任何一句给人看的话，中英两份页面因此不可能漂移。
   取不到的键原样吐出键名：光秃秃的键名是刺眼的失败，好过静默留白让业务以为
   这里本来就没字。占位符与 Python 侧同为 {name}。 */
const I18N = (DATA.doc && DATA.doc._i18n) || {};
/* 大写 T 是刻意的:refreshCarry() 里的循环变量已经叫 t,同名会把外层遮掉 —— 那样
   carry 提示行会静默变成一句报错或空白,而页面不会崩。 */
const T = (k, o) => String(I18N[k] ?? k).replace(/\{(\w+)\}/g,
  (m, p) => (o && p in o) ? o[p] : m);
/* 文案里带 <b> 的走 innerHTML，纯文本的走 textContent —— 见 fillChrome()。 */
const setText = (id, s) => { const el = document.getElementById(id); if(el) el.textContent = s; };

const TIER_LABEL = {src:['tier_src','src'], code:['tier_code','code'],
                    guess:['tier_guess','guess']};
const DECIDE_LABEL = {biz: ['decide_biz', 'biz'], dev: ['decide_dev', 'dev']};

function renderMasthead(){
  const d = DATA.doc, blocking = DATA.questions.filter(q => q.blocking).map(q => q.no);
  document.getElementById('masthead').innerHTML = `
    <div class="masthead-main">
      <div class="doc-kicker">${esc(T('kicker', {round: d.round}))}</div>
      <h1>${esc(d.title)}</h1>
      <div class="doc-meta">
        ${esc(T('sent_by'))}：<b>${esc(d.sent_by)}</b>　·　${
          esc(T('sent_on'))}：<b>${esc(d.sent_on)}</b><br>
        ${T('q_count', {n: DATA.questions.length,
          first: blocking.length ? T('q_count_first', {list: blocking.join(T('sep_list'))}) : ''})}
      </div>
      <div class="usage">${esc(d.usage)}</div>
      ${d.code_rev ? `<div class="rev">${
        esc(T('rev_note', {rev: d.code_rev.slice(0,8)}))}</div>` : ''}
    </div>
    <div class="seal"><span class="no">${esc(d.id)}</span>
      <span class="v">v${d.round} / R${d.round}</span>
      <span class="due">${esc(T('seal_total', {n: DATA.questions.length}))}</span></div>`;
  document.getElementById('howto').innerHTML =
    `<div class="howto-lb">${esc(T('howto_label'))}</div>`
    + `<div class="howto-grid">${[1, 2, 3, 4].map(i =>
        `<div class="howto-it"><span class="n">0${i}</span><span>${T('howto_' + i)}</span></div>`
      ).join('')}</div>`;
  document.title = T('page_title', {title: d.title});
}

function renderPart1(){
  if(!DATA.part1?.length){ document.getElementById('part1').remove(); return; }
  const rows = DATA.part1.map(r => `
    <div class="p1-row">
      <div class="p1-n">${r.n}</div>
      <div class="p1-m">
        <div class="p1-t">${esc(r.we_understand)}</div>
        ${r.note ? `<div class="p1-note">${esc(r.note)}</div>` : ''}
        <textarea class="p1why" id="p1-${r.n}-why" rows="2" placeholder="${esc(T('p1_why_ph'))}"></textarea>
      </div>
      <div class="p1-c"><div class="seg">
        <label class="seg-b ok"><input type="radio" name="p1-${r.n}" value="ok">${esc(T('p1_ok'))}</label>
        <label class="seg-b no"><input type="radio" name="p1-${r.n}" value="no">${esc(T('p1_no'))}</label>
      </div></div>
    </div>`).join('');
  document.getElementById('part1').innerHTML = `
    <div class="part-hd"><h2>${esc(T('p1_title'))}</h2>
      <span class="hint">${esc(T('p1_hint'))}</span></div>
    <div class="p1-card">${rows}
      <div class="p1-extra"><label for="a-part1">${esc(T('p1_extra'))}</label>
        <textarea id="a-part1" rows="2"></textarea></div>
    </div>`;
}

/* 依据区分两层：外层给业务看白话，坐标折叠在内层给开发与复核。
   业务看不懂 <文件路径>:<行号> 这种坐标，直接怼给他是噪音。 */
function citeHtml(c){
  const kindLabel = T(c.kind === 'src' ? 'tier_src' : 'tier_code');
  const coords = `<code>&gt; ${esc(T('evidence_word'))}: ${esc(c.path)}:${c.line} | "${esc(c.snippet)}"</code>`;
  if(c.kind !== 'code')
    return `<div class="cite"><span class="cite-k src">${esc(kindLabel)}</span>${coords}</div>`;
  const brs = (c.branches || []).map(b =>
    `<li>${esc(b.cond)} → ${esc(b.then)}${b.cite ? ` <code>${esc(b.cite)}</code>` : ''}</li>`).join('');
  return `<div class="cite code-cite">
      <div class="logic"><b>${esc(T('logic_lead'))}</b>${esc(c.logic)}
        <span class="logic-note">${esc(T('logic_note'))}</span></div>
      <details class="coords"><summary>${esc(T('coords_summary'))}</summary>
        <div>${coords}</div>
        <div class="entry">${esc(T('entry_label'))}<code>${esc(c.entry)}</code></div>
        ${brs ? `<ul class="brs">${brs}</ul>` : ''}
        ${c.branches_exhaustive === false
          ? `<div class="ev-weak">${esc(T('branches_partial'))}</div>` : ''}
      </details>
    </div>`;
}

/* 业务概念层：有 rules_ref 就显示规则条目那句业务语言，代码坐标留给内层。 */
function rulesHtml(ev){
  return (ev.rules_ref || []).map(r =>
    `<div class="cite rule-cite">
       <div class="logic"><b>${esc(T('rules_lead'))}</b>${esc(r.text)}
         <span class="logic-note">${esc(T('rules_note', {id: r.id}))}</span></div>
       <details class="coords"><summary>${esc(T('rules_doc_summary'))}</summary>
         <div><code>${esc(r.doc)} · ${esc(r.id)}</code></div></details>
     </div>`).join('');
}

function reviewHtml(ev){
  const rv = ev.reviewed;
  if(!rv) return `<div class="unreviewed">${esc(T('unreviewed'))}</div>`;
  return `<div class="reviewed">${esc(T('reviewed', {on: rv.on, diffs: rv.diffs,
    handled: rv.diffs > 0 ? T('reviewed_handled') : ''}))}</div>`;
}

/* 已有规则条目承载业务语言时，代码引用只出坐标，不再重复一句解读。 */
function codeCoordsOnly(c){
  if(c.kind !== 'code') return citeHtml(c);
  const brs = (c.branches || []).map(b =>
    `<li>${esc(b.cond)} → ${esc(b.then)}${b.cite ? ` <code>${esc(b.cite)}</code>` : ''}</li>`).join('');
  return `<details class="coords"><summary>${esc(T('coords_summary'))}</summary>
      <div><code>&gt; ${esc(T('evidence_word'))}: ${esc(c.path)}:${c.line} | "${esc(c.snippet)}"</code></div>
      <div class="entry">${esc(T('entry_label'))}<code>${esc(c.entry)}</code></div>
      ${brs ? `<ul class="brs">${brs}</ul>` : ''}
      ${c.branches_exhaustive === false
        ? `<div class="ev-weak">${esc(T('branches_partial'))}</div>` : ''}
    </details>`;
}

function evHtml(q){
  const ev = q.evidence || {}, [labelKey, cls] = TIER_LABEL[ev.tier] || TIER_LABEL.guess;
  const label = T(labelKey);
  const open = (ev.tier === 'guess' || ev.weak) ? ' open' : '';
  const hasCode = (ev.cites || []).some(c => c.kind === 'code');
  const cites = (rulesHtml(ev)
    + (ev.rules_ref?.length ? (ev.cites || []).map(codeCoordsOnly).join('')
                            : (ev.cites || []).map(citeHtml).join(''))
    + (hasCode ? reviewHtml(ev) : ''))
    || `<div class="cite none">${esc(T('ev_none'))}</div>`;
  return `<details class="ev tier-${cls}"${open}>
      <summary><span class="ev-badge ${cls}">${esc(label)}</span>
        <span class="ev-more">${esc(T('ev_more'))}</span></summary>
      <div class="ev-b">${cites}${ev.weak ? `<div class="ev-weak">⚠ ${esc(ev.weak)}</div>` : ''}</div>
    </details>
    <div class="deny">
      <label class="deny-t"><input type="checkbox" class="deny-x" data-q="${q.no}">
        <span class="mk"></span>${esc(T('deny_label'))}</label>
      <textarea class="deny-w" id="deny-${q.no}" rows="2"
        placeholder="${esc(T('deny_ph'))}"></textarea>
    </div>`;
}

function optHtml(name, o, allowAdvice){
  const isChoice = /^[A-Z]\d*$/.test(o.key);
  const extra = o.kind === 'nonexistent' || o.kind === 'dontknow' ? ' none' : '';
  const mark = o.kind === 'nonexistent' ? '⊘ ' : '';
  const cost = allowAdvice && o.cost ? `<span class="cost">${esc(o.cost)}</span>` : '';
  /* data-kind 是选项的语义档（dontknow/nonexistent/other），导出回执时原样带进
     机读区 —— 机检的「勾了不清楚却没给知情人」这条从此按结构判，不再猜 label 的
     字面。label 是自由文本、会随语言变；kind 不会。 */
  return `<label class="opt${extra}"><input type="radio" name="${name}" value="${esc(o.key)}"`
       + `${o.kind ? ` data-kind="${esc(o.kind)}"` : ''}`
       + ` data-label="${esc(o.label)}"><span class="mk"></span>`
       + `<span>${isChoice ? `<span class="k">${esc(o.key)}.</span>` : ''}`
       + `${mark}${esc(o.label)}${cost}</span></label>`;
}

function groupHtml(q, g){
  const name = g.id === 'main' ? `q${q.no}` : `q${q.no}_${g.id}`;
  const opts = g.options.map(o => optHtml(name, o, q.advice_allowed)).join('');
  const ask = g.ask ? `<div class="grp-q"${g.askShort ? ` data-ask="${esc(g.askShort)}"` : ''}>`
                    + `${esc(g.ask)}</div>` : '';
  const na = DATA.links?.na?.find(l => l.target === `${q.no}.${g.id}`);
  const naAttr = na ? ` data-na-when="${esc(whenToDom(na.when))}"`
                    + ` data-na-note="${esc(na.note)}"` : '';
  return `<div class="grp" data-grp="${g.id === 'main' ? 'main' : 'sub'}"${naAttr}>`
       + `${ask}<div class="opts${g.inline ? ' inline' : ''}">${opts}</div></div>`;
}

function demoHtml(q){
  if(!q.demo) return '';
  const rows = q.demo.rows.map(r =>
    `<tr data-hit="${r.when.join('|')}"><td class="k">${esc(r.k || T('demo_result'))}</td>`
  + `<td class="v">${esc(r.v)}</td></tr>`).join('');
  const assumed = q.demo.basis === 'assumed'
    ? `<div class="demo-assumed">${esc(T('demo_assumed'))}</div>` : '';
  return `<div class="demo"><div class="demo-hd"><span class="lb">${esc(T('demo_lb'))}</span>
      <span class="given">${esc(q.demo.given)}</span></div>
    <table><tbody>${rows}</tbody></table>${assumed}</div>`;
}

/** links.carry 的 from/to 写作 `<题号>.<字段id>`，字段id 即该题 reveal[].when 的键 ——
    那个输入框的 DOM id 就是 rv-<题号>-<字段id>。这是 carry 唯一的落点约定，
    出题时照它写 json；落不到 validate() 会在出包时红字拒收。 */
function carryDomId(ref){
  const p = String(ref).split('.');
  return p.length === 2 ? `rv-${p[0]}-${p[1]}` : null;
}

/** 把 DOM 形式的 when（q3=B & q2=B）翻成业务读得懂的话（D11/D16：业务面前不出 DOM 内部名）。
    机读区仍保留原始表达式 —— AI 要解析的是它，不是这句人话。 */
function whenInWords(expr){
  return String(expr).split('&').map(t => {
    const [n, v] = t.split('=');
    if(v === undefined) return t.trim();
    const no = (n.trim().replace(/^q/, '').match(/^\d+/) || [''])[0];
    const q = DATA.questions.find(x => String(x.no) === no);
    const key = v.trim();
    const opt = q && (q.groups || []).flatMap(g => g.options || [])
                     .find(o => String(o.key) === key);
    const label = opt ? opt.label : (key === 'other' ? T('other_label') : key);
    return T('when_pick', {no: no, label: label});
  }).join(T('when_join'));
}

/** schema 用题号（"2=B"），DOM 用输入框 name（"q2=B"）。 */
function whenToDom(expr){ return String(expr).replace(/(^|[\s&|])(\d+)(?=\s*(?:!=|=))/g, '$1q$2'); }

function questionHtml(q){
  const [dKey, dCls] = DECIDE_LABEL[q.decide] || DECIDE_LABEL.dev;
  const tags = [
    q.blocking ? `<span class="tag first">${esc(T('tag_first'))}</span>` : '',
    `<span class="tag d-${dCls}">${esc(T(dKey))}</span>`].join('');
  const reveals = (q.reveal || []).map(r => {
    const id = `rv-${q.no}-${r.when}`;
    /* carry：前面填过的事实带到这里当默认值。生产者只此一处 —— 缺了它
       refreshCarry() 就是只有消费者没有生产者，规格声明的事实传播静默不工作。 */
    const cy = (DATA.links?.carry || []).find(c => carryDomId(c.to) === id);
    const srcNo = cy ? String(cy.from).split('.')[0] : null;
    const cyAttr = cy ? ` data-carry-from="${esc(carryDomId(cy.from))}"`
                      + ` data-carry-src="${esc(T('w_question') + ' ' + srcNo)}"` : '';
    return `<div class="cond" data-when="q${q.no}=${esc(r.when)}">
       <div class="cond-hd" data-ask="${esc(r.ask)}">${esc(T('cond_hd', {key: r.when}))}</div>
       <div class="fld"><label for="${esc(id)}">${esc(r.ask)}</label>
         <input type="text" id="${esc(id)}"${cyAttr}>${
           cy ? '<span class="carry-hint"></span>' : ''}</div>
     </div>`;
  }).join('');
  const clash = (DATA.links?.clash || [])
    .filter(c => _when_first_no(c.when) === q.no)
    .map(c => `<div class="clash" data-clash-when="${esc(whenToDom(c.when))}">
       <b>${esc(T('clash_lead'))}</b>${esc(c.why)}
       ${c.require_explain === false ? ''
         : `<textarea id="clash-${q.no}" rows="2" placeholder="${esc(T('clash_ph'))}"></textarea>`}
     </div>`).join('');
  return `<article class="q" id="q${q.no}" data-no="${q.no}"
      data-title="${esc(q.title)}" data-decide="${esc(q.decide)}"${q.blocking ? ' data-first="1"' : ''}
      data-layer="${q.layer}">
    <div class="q-hd"><div class="q-no">${q.no}</div><div class="h">
      <h3 class="q-t">${esc(q.title)}</h3><div class="tags">${tags}</div></div></div>
    <div class="q-bd">${evHtml(q)}
      ${q.background ? `<p class="bg">${esc(q.background)}</p>` : ''}
      ${q.groups.map(g => groupHtml(q, g)).join('')}
      ${demoHtml(q)}${reveals}${clash}
      <div class="ans"><label for="a-q${q.no}">${esc(T('answer_label'))}</label>
        <textarea id="a-q${q.no}" rows="2"></textarea></div>
    </div></article>`;
}

/** clash 挂在其条件里题号最大的那道题上——业务是选到那一步才会撞上冲突。 */
function _when_first_no(expr){
  const nos = [...String(expr).matchAll(/(\d+)\s*(?:!=|=)/g)].map(m => +m[1]);
  return nos.length ? Math.max(...nos) : null;
}

function renderPart2(){
  const layers = [...new Set(DATA.questions.map(q => q.layer))].sort((a, b) => a - b);
  document.getElementById('part2').innerHTML =
    `<div class="part-hd"><h2>${esc(T('p2_title'))}</h2>
       <span class="hint">${esc(T('p2_hint', {n: DATA.questions.length}))}</span></div>`
  + layers.map(n => {
      const why = (DATA.layers || []).find(l => l.n === n)?.why;
      const qs = DATA.questions.filter(q => q.layer === n);
      const head = n === layers[0] ? ''
        : `<div class="layer-hd">${esc(T('layer_gate'))}${
            why ? esc(T('layer_why', {why: why})) : ''}</div>`;
      return head + qs.map(questionHtml).join('');
    }).join('');
}

/* 索引 */

rail.innerHTML = (P1.length

/* 索引悬浮栏:宽屏是常驻窄条、悬停展开(collapsed 类不参与,把手隐藏);
   窄屏没有悬停,退回「把手呼出浮层」,默认收起,用户手动点过就记住选择并覆盖默认。
   RAIL_BREAKPOINT 必须与 CSS 的 max-width:999px 媒查同一条线。 */
const railNav = document.getElementById('railNav');
const railToggle = document.getElementById('railToggle');
const RAIL_BREAKPOINT = 1000;
let railUserPref = null;
try{ railUserPref = localStorage.getItem('rc-rail'); }catch(e){}

function setRailCollapsed(collapsed){
  railNav.classList.toggle('collapsed', collapsed);
  railToggle.textContent = T(collapsed ? 'rail_open' : 'rail_close');
  railToggle.setAttribute('aria-expanded', String(!collapsed));

function applyRailDefault(){
  if(railUserPref === 'open'){ setRailCollapsed(false); return; }
  if(railUserPref === 'closed'){ setRailCollapsed(true); return; }
  setRailCollapsed(window.innerWidth < RAIL_BREAKPOINT);

  const collapsed = !railNav.classList.contains('collapsed');

  try{ localStorage.setItem('rc-rail', railUserPref); }catch(e){}

const val = name => (document.querySelector(`input[name="${name}"]:checked`)||{}).value || null;
const txt = id => { const el=document.getElementById(id); return el ? el.value.trim() : ''; };
const denied = q => q.querySelector('.deny-x').checked;

/* 进度 */
function answered(q){
  if(denied(q)) return true;
  const main = q.querySelector('[data-grp="main"]');
  if(main) return !!main.querySelector('input:checked');
  return [...q.querySelectorAll('textarea,input[type=text]')].some(el=>el.value.trim());
}
function refreshStatus(){
  let done=0, den=0, mustLeft=[];
  QS.forEach(q=>{
    const ok=answered(q);
    if(ok) done++; else if(q.dataset.first) mustLeft.push(q.dataset.no);
    if(denied(q)) den++;
    q.classList.toggle('answered', ok && !denied(q));
    let tag=q.querySelector('.tag.done');
    const want = denied(q) ? T('tag_denied') : (ok ? T('tag_done') : null);
    if(want && !tag){ tag=document.createElement('span'); tag.className='tag done'; q.querySelector('.tags').appendChild(tag); }
    if(!want && tag) tag.remove();
    if(want) q.querySelector('.tag.done').textContent = want;
    const a=rail.querySelector(`a[data-q="${q.id}"]`);
    a.dataset.st = ok ? (denied(q)?'skip':'done') : (q.dataset.first?'must':'');
  });
  const p1done = P1.filter(i=>val(`p1-${i}`)).length;
  const p1a = rail.querySelector('a[data-q="part1"]');
  if(p1a){
    p1a.dataset.st = p1done === P1.length ? 'done' : 'p1';
    const f = document.getElementById('railP1Frac');
    if(f) f.textContent = `${p1done}/${P1.length}`;
  }
  document.getElementById('meter').style.width = ((done+p1done)/(QS.length+P1.length)*100)+'%';
  const st=[T('st_done', {done: done, total: QS.length})];
  if(P1.length) st.push(p1done < P1.length
    ? T('st_p1_mute', {n: P1.length - p1done})
    : T('st_p1', {done: p1done, total: P1.length}));
  if(den) st.push(T('st_denied', {n: den}));
  if(mustLeft.length) st.push(T('st_must', {list: mustLeft.join(T('sep_list'))}));
  const cl=clashes().length;
  if(cl) st.push(T('st_clash', {n: cl}));
  document.getElementById('statusText').innerHTML = st.join(T('st_sep'));
  document.getElementById('dockWhy').textContent =
    (done<QS.length ? T('dock_left', {n: QS.length-done}) : '');
}

function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* 跨题联动：cond 表达式只支持 & 连接的等值判断。
   `|` / `!=` / `in [...]` 尚未实现 —— validate() 会在出包时拒收，这里再兜一层：
   拆不出等号的 token 一律不命中，绝不能抛。一抛 refreshAll() 就断在这儿，
   进度条／身份选择器／导出按钮全失效，而业务屏幕上没有任何提示。 */
function meets(expr){
  return String(expr).split('&').every(t=>{
    const [n,v]=t.trim().split('=');
    if(v===undefined) return false;
    return val(n.trim())===v.trim();
  });
}
/* derive：前面的选择让后面某组题在逻辑上不存在 → 置为不适用，不算漏答。
   推导链用真实 .na-note 元素承载（不再靠 content:attr()）：命中时若还没有就插入一个，
   已有就只更新文案，避免每次 refreshAll() 重复插入；条件变回来时把它删掉，不留孤儿节点。 */
function refreshNA(){
  document.querySelectorAll('[data-na-when]').forEach(g=>{
    const on = meets(g.dataset.naWhen);
    g.classList.toggle('na', on);
    let note = g.querySelector(':scope > .na-note');
    if(on){
      if(!note){
        note = document.createElement('div');
        note.className = 'na-note';
        g.appendChild(note);
      }
      note.innerHTML = T('na_note', {note: esc(g.dataset.naNote)});
    } else if(note){
      note.remove();
    }
  });
}
/* carry：把前面填过的事实（字段名、人名、天数）带到后面当默认值，可改 */
function refreshCarry(){
  document.querySelectorAll('[data-carry-from]').forEach(t=>{
    const s=document.getElementById(t.dataset.carryFrom), hint=t.parentElement.querySelector('.carry-hint');
    if(!s) return;
    const sv=s.value.trim();
    if(!sv){ t.dataset.auto='0'; }
    else if(!t.value.trim() || t.value.trim()===(t.dataset.autoVal||'')){
      // 空着、或还拿着上次自动填的值 → 可以带；业务一动手就不再覆盖
      t.value=sv; t.dataset.autoVal=sv; t.dataset.auto='1';
    } else { t.dataset.auto='0'; }
    const on = t.dataset.auto==='1' && !!sv;
    t.classList.toggle('carried', on);
    if(hint){ hint.classList.toggle('on', on);
      hint.textContent = on ? T('carry_hint', {src: t.dataset.carrySrc, v: sv}) : ''; }
  });
}
/* clash：矛盾当场暴露，不等回执回来才由 AI 做冲突检测 */
function clashes(){
  return [...document.querySelectorAll('[data-clash-when]')].filter(c=>meets(c.dataset.clashWhen));
}
function refreshClash(){

/* 硬活筛选：业务想先看哪些必须自己定。只改显隐，不改归属——没有"我是谁"，也不折叠任何题。 */
let decideFilter = '';   // '' | 'biz' | 'dev'
function buildDecideRow(){
  const row = document.getElementById('whoRow');
  const count = v => QS.filter(q => !v || q.dataset.decide === v);
  const cell = (v, label) => {
    const mine = count(v), done = mine.filter(answered).length;
    return `<button type="button" class="whochip${decideFilter === v ? ' on' : ''}"`
         + ` data-decide="${v}">${label}<span class="c">${done}/${mine.length}</span></button>`;
  };
  row.innerHTML = `<span class="lb">${esc(T('filter_lead'))}</span>`
    + cell('', esc(T('filter_all'))) + cell('biz', esc(T('filter_biz')))
    + cell('dev', esc(T('filter_dev')));
  row.querySelectorAll('.whochip').forEach(b => b.onclick = () => {
    decideFilter = b.dataset.decide; refreshAll();
  });
}
function refreshDecideFilter(){
  QS.forEach(q => q.hidden = !!decideFilter && q.dataset.decide !== decideFilter);
  rail.querySelectorAll('a').forEach(a => {
    const q = document.getElementById(a.dataset.q);
    a.classList.toggle('dim', !!q && q.hidden);
  });
}

function refreshAll(){
  refreshPart1(); refreshConditions(); refreshNA(); refreshCarry(); refreshClash();
  refreshDemos(); refreshStatus(); refreshDecideFilter(); buildDecideRow();
  document.getElementById('s-date').value = stamp();
}
document.addEventListener('input', refreshAll);
document.addEventListener('change', refreshAll);

function jumpNext(){
  (QS.find(q=>!answered(q))||document.getElementById('signoff'))
    .scrollIntoView({behavior:'smooth',block:'start'});
}
QS.forEach(q=>new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) rail.querySelectorAll('a').forEach(a=>a.classList.toggle('on', a.dataset.q===q.id));
}),{rootMargin:'-80px 0px -70% 0px'}).observe(q));
/* 第一部分也进索引:滚到它时高亮 P1 行(没有 part1 的单子里该节点已被移除) */
const p1Sec = document.getElementById('part1');
if(p1Sec) new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) rail.querySelectorAll('a').forEach(a=>a.classList.toggle('on', a.dataset.q==='part1'));
}),{rootMargin:'-80px 0px -70% 0px'}).observe(p1Sec);

/* ── 回执 ─────────────────────────────────────────────── */
function buildReceipt(){
  const L=[], J={单据:DATA.doc.id, 轮次:DATA.doc.round, 代码依据:DATA.doc.code_rev,
                 导出时间:stamp(), 第一部分:[], 题目:[]};
  const denies=QS.filter(denied).map(q=>q.dataset.no);
  const unans=QS.filter(q=>!answered(q)).map(q=>q.dataset.no);
  const p1done=P1.filter(i=>val(`p1-${i}`)).length;

  L.push(T('rc_title', {title: DATA.doc.title, round: DATA.doc.round}));
  L.push(T('rc_meta', {now: stamp(), sent_on: DATA.doc.sent_on, sent_by: DATA.doc.sent_by}));
  L.push(T('rc_grade', {done: QS.length-unans.length, total: QS.length})
       + (denies.length?T('rc_grade_denied', {n: denies.length, list: denies.join(T('sep_list'))}):'')
       + (unans.length?T('rc_grade_unans', {n: unans.length, list: unans.join(T('sep_list'))}):'')
       + (P1.length ? T('rc_grade_p1', {done: p1done, total: P1.length}) : '')
       + (clashes().length?T('rc_grade_clash', {n: clashes().length}):''));
  const byDecide = v => QS.filter(q => q.dataset.decide === v);
  const bizQ = byDecide('biz'), devQ = byDecide('dev');
  L.push(T('rc_split', {biz: bizQ.length, biz_done: bizQ.filter(answered).length,
                        dev: devQ.length, dev_done: devQ.filter(answered).length}));
  const cls=clashes();
  if(cls.length){
    L.push('');
    L.push(T('rc_clash_head'));
    cls.forEach(c=>{
      const ta=c.querySelector('textarea');
      L.push('');
      L.push(T('rc_clash_item', {when: whenInWords(c.dataset.clashWhen),
        text: c.textContent.replace(/\s+/g,' ').trim().slice(0,140)}));
      L.push(T('rc_clash_note',
        {v: ta && ta.value.trim() ? ta.value.trim() : T('rc_not_explained')}));
      J.矛盾=J.矛盾||[]; J.矛盾.push({条件:c.dataset.clashWhen, 说明:ta?ta.value.trim():''});
    });
  }
  if(P1.length){
    L.push('');
    L.push(T('rc_p1_head'));
    L.push('');
    L.push(T('rc_p1_cols'));
    L.push('|---|---|---|');
    const p1txt=[];
    P1.forEach(i=>{
      const v=val(`p1-${i}`), why=txt(`p1-${i}-why`);
      /* 人读表格写 locale 词，机读区写机器枚举 ok|no|mute —— 机检数「未表态」
         的条数时不必再认某句中文字面，英文回执也走同一条判据。 */
      const s = v==='ok' ? T('p1_ok') : v==='no' ? T('p1_no') : T('p1_mute');
      L.push(`| ${i} | ${s} | ${v==='no'?(why||T('rc_p1_no_reason')):''} |`);
      p1txt.push(`${i} ${s}${v==='no'&&why?T('paren', {v: why}):''}`);
      J.第一部分.push({条:i, 核对:(v==='ok'?'ok':v==='no'?'no':'mute'), 说明:v==='no'?why:''});
    });
    L.push('');
    const allOk = P1.every(i=>val(`p1-${i}`)==='ok');
    L.push(T('answer_mark_inline') + (allOk ? T('rc_p1_all_ok', {n: P1.length})
                                     : T('rc_p1_each')+p1txt.join(T('sep_semi')))
                       + (txt('a-part1')
                          ? T('rc_p1_extra', {v: txt('a-part1').replace(/\n/g,' ')}) : ''));
  }
  L.push('');
  L.push(T('rc_p2_head'));

  QS.forEach(q=>{
    const no=q.dataset.no, off=denied(q);
    /* 阻塞 必须写进机读区:check_questionnaire.py 的结构化路径靠它判「阻塞级未答 → FAIL」。
       缺这个字段时机检只能降级成一律 WARN —— 不报错,只是拦不住人,是静默失效。 */
    /* 主选kind 是选中项的语义档(dontknow/nonexistent/other),取自 questionnaire.json
       的 kind、由 optHtml 落成 data-kind。机检的规则 3 靠它判「勾了不清楚」,
       不再猜 label 的字面;`other` 则是阶段三「选项集猜错了、要再来一轮」的结构信号。 */
    const rec={题号:no, 阻塞:!!q.dataset.first, 主选:null, 主选kind:null, 子项:{}, 跳过:[],
               不成立:null, 补充:'', 依据:[]};
    q.querySelectorAll('.ev code').forEach(c=>rec.依据.push(c.textContent.replace(/^&gt; ?/,'')));
    const _ev = (DATA.questions.find(x=>String(x.no)===no)||{}).evidence || {};
    if(_ev.rules_ref) rec.规则引用 = _ev.rules_ref;
    rec.独立复核 = _ev.reviewed
      || ((_ev.cites||[]).some(c=>c.kind==='code') ? '未复核' : null);
    L.push('');
    L.push(T('rc_qhead', {no: no, title: q.dataset.title,
      decide: T(q.dataset.decide === 'biz' ? 'decide_biz' : 'decide_dev_md'),
      blocking: q.dataset.first ? T('rc_blocking') : ''}));
    if(off){
      const why=txt('deny-'+no)||T('rc_no_reason');
      L.push(T('rc_denied_line', {why: why}));
      rec.不成立=why;
    }
    const main=q.querySelector('[data-grp="main"]');
    if(main) main.querySelectorAll('input').forEach(i=>{
      const key=/^[A-Z]$/.test(i.value)?i.value+'. ':'';
      const on = i.checked && !off;
      L.push(`${on?'☑':'☐'} ${key}${i.dataset.label}`);
      if(on){ rec.主选=key+i.dataset.label; rec.主选kind=i.dataset.kind||null; }
    });

    const pairs=new Map();
    const put=(ask,v)=>{ const k=ask.trim().replace(/[：:？?\s]+$/,'');
      pairs.set(k, pairs.has(k)?pairs.get(k)+T('sep_or')+v:v); };
    const askOfChoice=el=>{ const g=el.closest('.grp,.cond');
      const h=g&&g.querySelector('.grp-q,.cond-hd');
      return h?(h.dataset.ask||h.textContent):T('md_sub_fallback'); };
    const askOfField=el=>{ const lb=el.id&&q.querySelector(`label[for="${el.id}"]`);
      return lb?lb.textContent:askOfChoice(el); };
    if(!off){
      q.querySelectorAll('[data-grp="sub"].na').forEach(g=>{
        const ask=(g.querySelector('.grp-q')||{}).textContent||T('md_sub_fallback');
        put(ask, T('rc_na', {note: g.dataset.naNote}));
        rec.不适用=rec.不适用||[]; rec.不适用.push(g.dataset.naNote);
      });
      q.querySelectorAll('[data-grp="sub"]:not(.na) input:checked, .cond.show input:checked').forEach(i=>{
        put(askOfChoice(i), i.dataset.label);
        rec.子项[i.name]=rec.子项[i.name]?rec.子项[i.name]+T('sep_or')+i.dataset.label:i.dataset.label;
      });
      q.querySelectorAll('.cond.show input[type=text], [data-grp="sub"]:not(.na) textarea, .cond.show textarea').forEach(el=>{
        if(el.value.trim()){ put(askOfField(el), el.value.trim()); rec.子项[el.id]=el.value.trim(); }
      });
    }
    const subs=[...pairs].map(([k,v])=>k+T('sep_kv')+v);
    if(!off) q.querySelectorAll('.skipped.show').forEach(s=>{
      const [n,v]=s.dataset.skip.split('=');
      const line=T('rc_skip', {no: n.replace(/\D/g,''), v: v});
      subs.push(line); rec.跳过.push(line);
    });
    const extra=txt('a-q'+no); if(extra) rec.补充=extra;
    L.push(T('answer_mark_inline')
      +[off?T('rc_denied_inline', {why: txt('deny-'+no)||T('rc_no_reason')}):'', ...subs, extra]
      .filter(Boolean).join(T('sep_semi')).replace(/\n/g,' '));
    J.题目.push(rec);
  });

  L.push('');
  L.push(T('rc_sign_head'));
  L.push(T('rc_sign_line', {date: stamp()}));
  if(txt('s-relay')) L.push(T('rc_relay', {v: txt('s-relay')}));
  /* 落款只剩两件事:页面自动记的导出时间,和业务写给开发的补充说明。
     键名是与 check_questionnaire.py 的协议,改名要连着 checker 一起改。 */
  J.落款={导出时间:stamp(), 补充说明:txt('s-relay')};
  L.push('');
  L.push(T('rc_machine_note'));
  L.push('```json');
  L.push(JSON.stringify(J));
  L.push('```');
  return {md: L.join('\n'), J: J};
}

/* 发回给 AI 的最小形态:标题一行 + 机读区。
   为什么不是整份 md —— 人读正文是给业务在页面上核对用的,AI 读的是机读区;
   把 md 再复制一遍只是让聊天窗里多出几屏没人读的文本。机检对这份最小形态
   照走结构化路径(题目/核对/矛盾结构都在机读区里),七条规则一条不少。 */
function buildMachineReceipt(){
  return [T('rc_title', {title: DATA.doc.title, round: DATA.doc.round}),
          '```json', JSON.stringify(buildReceipt().J), '```'].join('\n');
}

const dlg=document.getElementById('dlg');
/* esc 由上面的渲染器定义（多转义了引号），此处不再重复声明 —— 同一作用域两个
   const esc 会让整段 <script> 直接 SyntaxError。 */

/* 人读回执：业务不懂 markdown——预览就不该是 markdown。
   摘要给业务核对，要发回的机读文本折叠起来留给开发。 */
function renderPreview(){
  const den=QS.filter(denied), un=QS.filter(q=>!answered(q));
  const p1done=P1.filter(i=>val(`p1-${i}`)).length, cls=clashes();
  /* variant: ''（常规态白底）｜ 'warn'（琥珀·成立但没验过，如核对未齐）｜
     'bad'（红·拦人，如没答／矛盾）——颜色角色须与 statusText／.status-text .amb 一致，
     不能让同一件事（核对未齐）在两处显示成不同颜色。 */
  const card=(v,l,variant)=>`<div class="rc-card${variant?' '+variant:''}"><b>${v}</b><span>${l}</span></div>`;

  let h = '<div class="rc-cards">'
    + card(`${QS.length-un.length}/${QS.length}`, esc(T('pv_answered')))
    + (P1.length ? card(`${p1done}/${P1.length}`, esc(T('pv_checked')),
                        p1done<P1.length ? 'warn' : '') : '')
    + (den.length?card(den.length, esc(T('pv_denied'))):'')
    + (un.length?card(un.length, esc(T('pv_unanswered')), 'bad'):'')
    + (cls.length?card(cls.length, esc(T('pv_clash')), 'bad'):'')
    + '</div>';

  /* 署名条已拆除 —— 剩导出时间这一行,它是页面自己记的,不问业务要。 */
  h += `<div class="rc-sign">${esc(T('pv_exported_at', {now: stamp()}))}</div>`;

  cls.forEach(c=>{
    const ta=c.querySelector('textarea'), said=ta&&ta.value.trim();
    h += `<div class="rc-clash"><b>${esc(T('pv_clash_head'))}</b>`
       + esc(T('paren', {v: whenInWords(c.dataset.clashWhen)}) + T('sep_kv'))
       + esc(said ? T('pv_clash_said', {v: said}) : T('pv_clash_none'))
       + '</div>';
  });

  h += '<ol class="rc-list">';
  QS.forEach(q=>{
    const no=q.dataset.no, off=denied(q);
    const main=q.querySelector('[data-grp="main"] input:checked');
    let cl='', ans;
    if(off){ cl='no'; ans=T('pv_denied_ans', {why: txt('deny-'+no)||T('pv_no_reason')}); }
    else if(main && main.value==='other'){
      ans=T('pv_other', {v: txt('other-'+no)||T('pv_other_none')}); }
    else if(main){ ans=(/^[A-Z]$/.test(main.value)?main.value+'. ':'')+main.dataset.label; }
    else { cl='gap'; ans=T('pv_unans')+(q.dataset.first?T('pv_unans_first'):''); }
    const subs=[];
    q.querySelectorAll('[data-grp="sub"].na').forEach(g=>
      subs.push(((g.querySelector('.grp-q')||{}).textContent||'') + T('sep_kv')
                + T('rc_na', {note: g.dataset.naNote})));
    if(!off) q.querySelectorAll('[data-grp="sub"]:not(.na) input:checked, .cond.show input:checked')
      .forEach(i=>subs.push(i.dataset.label));
    h += `<li class="${cl}"><span class="n">${no}</span><span>`
       + `<span class="qt">${esc(q.dataset.title)}</span>`
       + `<span class="a">${esc(ans)}`
       + (subs.length?`<span class="sub">${esc(subs.join(' · '))}</span>`:'')
       + '</span></span></li>';
  });
  h += '</ol>';
  return h;
}
function openReceipt(){
  document.getElementById('rcBody').innerHTML = renderPreview();
  /* 折叠区里放的就是「复制」会复制的那份文本 —— 两处不同会让业务复制到
     一份自己没看过的东西。完整 md 只走「下载」那条路(存档用)。 */
  document.getElementById('receipt').textContent = buildMachineReceipt();
  dlg.showModal();
}
function downloadReceipt(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buildReceipt().md],{type:'text/markdown;charset=utf-8'}));
  a.download=`${DATA.doc.id}-${T('rc_file_word')}-${stamp().slice(0,10)}.md`;
  a.click(); URL.revokeObjectURL(a.href);
}
async function copyReceipt(btn){
  try{ await navigator.clipboard.writeText(buildMachineReceipt()); btn.textContent=T('copied');
       setTimeout(()=>btn.textContent=T('copy'),1800); }
  catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('receipt'));
    getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent=T('copy_manual'); }
}

/* 兜底出口：一次性发单、业务异步回填，中间没有 AI —— 选项集猜错了业务当场没法跟 AI 说，
   所以每题都必须留一条「都不是」的路，而不是逼人在错的选项里勉强挑一个。 */
QS.forEach(q=>{
  const no=q.dataset.no, main=q.querySelector('[data-grp="main"]');
  if(!main) return;
  const name=main.querySelector('input').name;
  /* data-kind="other" 让「选项集猜错了」变成机读区里的结构信号:阶段三判「要不要
     再来一轮」不必再去文本里匹配那句兜底文案。 */
  main.querySelector('.opts').insertAdjacentHTML('beforeend',
    `<label class="opt other"><input type="radio" name="${name}" value="other"`
   + ` data-kind="other" data-label="${esc(T('other_label'))}"><span class="mk"></span>`
   + `<span>${esc(T('other_opt'))}</span></label>`);
  main.insertAdjacentHTML('afterend',
    `<div class="cond" data-when="${name}=other">`
   + `<div class="cond-hd" data-ask="${esc(T('other_ask'))}">${esc(T('other_cond_hd'))}</div>`
   + `<div class="fld"><input type="text" id="other-${no}" placeholder="${esc(T('other_ph'))}"></div></div>`);
});

refreshAll();
</script>
