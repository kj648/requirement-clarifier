name: Release Skill

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skill
        run: python3 scripts/validate_skill.py .

      - name: Package skill
        run: |
          # docs/superpowers/* 是内部 SDD 产物(design/plan/prototype),不随包分发:
          # 里面留着已被明令删除的「回填期限 3 个工作日」「due_days: 3」「建议由 XX
          # 回答」这类历史决定 —— 装了 skill 的人翻到它会照着做,与现行纪律直接冲突。
          # 这份排除列表与 README.md「本地打包」那条命令必须逐字相同。
          zip -r "requirement-clarifier.skill" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "docs/superpowers/*" \
            -x ".superpowers/*" \
            -x "__pycache__/*" \
            -x "scripts/__pycache__/*" \
            -x "tests/__pycache__/*" \
            -x "*.pyc" \
            -x ".DS_Store" \
            -x ".gitignore"
          ls -lh "requirement-clarifier.skill"

      - name: Upload .skill to release
        uses: softprops/action-gh-release@v2
        with:
          files: requirement-clarifier.skill
          body: |
            安装方式：
            1. 下载 `requirement-clarifier.skill`。
            2. 在 OpenCode / Claude Code 中导入该文件，或解压到对应 skill 目录。
            
            许可证：PolyForm Noncommercial License 1.0.0（非商用）。
